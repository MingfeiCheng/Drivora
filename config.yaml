# basic config
debug: true
pytree_debug: false  # Enable py_trees debug mode
open_vis: true  # Open visualization
save_agent_internal: true  # Save agent's internal visualization/data to results
resume: true
max_sim_time: 30.0  # seconds, default is 120 seconds -> the scenario max running time
distribute_num: 2

# tag is important for identification
run_tag: ""

# path
output_root: ""
fuzzer_dir: "fuzzer"  # directory containing fuzzer modules to discover

# container config & carla 
# NOTE: currently, only one carla container is supported, can be extended
carla:
  image: "carlasim/carla:0.9.15"
  fps: 20
  is_sync: true
  random_seed: 42  # random seed for carla server

# fuzzer config
tester:
  type: 'random'  # the fuzzer to use
  time_budget: 4  # hours, time budget for the fuzzer
  config_path: '' # just give the config path
  population_size: 5  # number of scenarios per generation

agent:
  entry_point: "agent_corpus.roach.agent:RoachAgent"
  config_path: "agent_corpus/roach/config/config_agent.yaml"
  ads_venv_dir: ".venvs/roach"  # uv venv directory for ADS evaluation

scenario:
  seed_path: ""
  executor_script: "scenario_corpus/openscenario/run_scenario.py"

hydra:
  output_subdir: null
  job:
    chdir: false
  run:
    dir: ${output_root}/hydra