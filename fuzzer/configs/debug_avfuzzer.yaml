
# AVFuzzer config — GA-based fuzzer (faithful to original paper)

# GA parameters (matching original AVFuzzer)
population_size: 4
mutation_prob: 0.6            # pm: per-individual mutation probability
crossover_prob: 0.6           # pc: crossover probability
selection: "roulette"         # "roulette" or "top2"
stagnation_gens: 5            # restart if no improvement for this many gens
lis_interval: 3               # trigger LIS every N gens after last restart
lis_generations: 5            # inner GA generations for LIS
lis_pm_factor: 1.5            # mutation rate multiplier for LIS

# Perturbation bounds for mutation
speed_bounds: [1.0, 15.0]    # [min, max] NPC speed (m/s)
trigger_bounds: [0.0, 10.0]  # [min, max] NPC trigger time (s)

feedback:
  scale_collision: 10.0
  scale_stuck: 180.0
  scale_destination: 20.0

oracle:
  collision_recheck: true

mutator:

scenario_space:

  map_region_space:
    town: "Town02"
    region_x_min: 40.0
    region_x_max: 125.0
    region_y_min: 200.0
    region_y_max: 295.0

  ego_space:
    route_length:
      - 50.0
      - 150.0
    ego_task_assignment: "LEFT"
    corssing_junction: true

  npc_vehicle_space:
    num:
      - 1
      - 3
    route_length:
      - 40.0
      - 200.0

  npc_pedestrian_space:
    num:
      - 0
      - 2

  npc_static_space:
    num:
      - 0
      - 1
