
# SAMOTA config — Surrogate-Assisted Multi-Objective Testing Algorithm

# SAMOTA parameters
initial_db_size: 6           # initial database size (random sampling)
gs_pop_size: 6               # population size for surrogate-guided NSGA-II
gs_generations: 100          # number of GA generations in Global Search

# Archive thresholds (objective value at which we consider it "covered")
# Lower = stricter. 0.0 = only collision/stuck/destination actually happened
thresholds:
  - 0.1    # DfC: lane center
  - 0.1    # DfV: vehicle collision proximity
  - 0.1    # DfP: pedestrian collision proximity
  - 0.1    # DfM: static collision proximity
  - 0.1    # DT:  traffic rules
  - 0.1    # Dest: destination distance

feedback:
  scale_vehicle: 10.0       # DfV normalization
  scale_pedestrian: 10.0    # DfP normalization
  scale_static: 10.0        # DfM normalization
  scale_destination: 20.0   # Dest normalization

oracle:
  collision_recheck: true

mutator:
  # Perturbation params (for candidate → seed conversion)
  speed_delta: 2.0
  speed_min: 1.0
  speed_max: 15.0
  trigger_delta: 2.0
  trigger_min: 0.0
  trigger_max: 10.0
  weather_delta: 15.0
  tl_time_delta: 2.0

scenario_space:

  map_region_space:
    town: "Town02"
    region_x_min: 40.0
    region_x_max: 125.0
    region_y_min: 200.0
    region_y_max: 295.0

  ego_space:
    route_length:
      - 50.0
      - 150.0
    ego_task_assignment: "LEFT"
    corssing_junction: true

  npc_vehicle_space:
    num:
      - 1
      - 3
    route_length:
      - 40.0
      - 200.0

  npc_pedestrian_space:
    num:
      - 0
      - 2

  npc_static_space:
    num:
      - 0
      - 1
