
# BehAVExplor config — coverage-guided scenario fuzzer

# BehAVExplor parameters
initial_corpus_size: 4        # build corpus of this size before fuzzing
batch_size: 1                 # scenarios per generation

feedback:
  scale_collision: 10.0
  scale_stuck: 180.0
  scale_destination: 20.0
  # Coverage model parameters
  coverage_step: 2            # frame subsampling for behavior extraction
  coverage_cluster_num: 50    # KMeans clusters
  coverage_window_size: 10    # sliding window size (frames)
  coverage_threshold: 0.4     # new coverage threshold
  coverage_dynamic_threshold: false

oracle:
  collision_recheck: true

mutator:
  # Mutation space parameters (used by behavior_mutator)
  mutation_space:
    MIN_TRIGGER_TIME: 0.0
    MAX_TRIGGER_TIME: 5.0
    MIN_VEHICLE_NUM: 1
    MAX_VEHICLE_NUM: 5
    MIN_VEHICLE_SPEED: 1.0
    MAX_VEHICLE_SPEED: 15.0
    DELTA_VEHICLE_SPEED: 2.0
    MIN_WALKER_NUM: 0
    MAX_WALKER_NUM: 3
    MIN_STATIC_NUM: 0
    MAX_STATIC_NUM: 2

scenario_space:

  map_region_space:
    town: "Town02"
    region_x_min: 40.0
    region_x_max: 125.0
    region_y_min: 200.0
    region_y_max: 295.0

  ego_space:
    route_length:
      - 50.0
      - 150.0
    ego_task_assignment: "LEFT"
    corssing_junction: true

  npc_vehicle_space:
    num:
      - 1
      - 3
    route_length:
      - 40.0
      - 200.0

  npc_pedestrian_space:
    num:
      - 0
      - 2

  npc_static_space:
    num:
      - 0
      - 1
